  .hidden{display:none;}

  {word:"住", pinyin:["zhù"], pos:"v.", meaning:"ở, sống"},
  {word:"桌子", pinyin:["zhuō", "zi"], pos:"n.", meaning:"cái bàn"},
  {word:"字", pinyin:["zì"], pos:"n.", meaning:"chữ"},
  {word:"昨天", pinyin:["zuó", "tiān"], pos:"n.", meaning:"hôm qua"},
  {word:"做", pinyin:["zuò"], pos:"v.", meaning:"làm"},
  {word:"坐", pinyin:["zuò"], pos:"v.", meaning:"ngồi"}
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function rubyHTML(word, pinyinArr){
  const chars = Array.from(word);
  return chars.map((ch,i) => `<ruby>${ch}<rt>${pinyinArr[i] || ''}</rt></ruby>`).join('');
}
function plainPinyin(pinyinArr){ return pinyinArr.join(' '); }

// strip tone diacritics for lenient comparison
const TONE_MAP = {
  'ā':'a','á':'a','ǎ':'a','à':'a',
  'ē':'e','é':'e','ě':'e','è':'e',
  'ī':'i','í':'i','ǐ':'i','ì':'i',
  'ō':'o','ó':'o','ǒ':'o','ò':'o',
  'ū':'u','ú':'u','ǔ':'u','ù':'u',
  'ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v',
  'ń':'n','ň':'n','ǹ':'n'
};
function stripTones(s){
  return s.split('').map(ch => TONE_MAP[ch] || ch).join('');
}
function normalizePinyin(s){
  return stripTones((s||'').toLowerCase().trim()).replace(/[^a-z]/g,'');
}

const QUESTION_COUNT = 20;
const questions = shuffle(POOL).slice(0, QUESTION_COUNT);
let current = 0;
let answers = new Array(questions.length).fill(null).map(()=>({done:false, userAnswer:'', isCorrect:false}));

const $ = id => document.getElementById(id);

let zhVoice = null;
function pickZhVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  zhVoice = voices.find(v=>v.lang==='zh-CN') || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
}
if('speechSynthesis' in window){ pickZhVoice(); window.speechSynthesis.onvoiceschanged = pickZhVoice; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  if(!zhVoice) pickZhVoice();
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  if(zhVoice) u.voice = zhVoice;
  u.rate = 0.8;
  window.speechSynthesis.speak(u);
}

function renderQuestion(){
  const q = questions[current];
  const a = answers[current];
  $('qnum').textContent = 'Q-' + String(current+1).padStart(2,'0');
  $('progressLabel').textContent = `Câu ${current+1} / ${questions.length}`;
  $('progressFill').style.width = (current/questions.length*100) + '%';

  $('typeInput').value = a.userAnswer || '';
  $('typeInput').disabled = a.done;
  $('typeInput').className = 'type-input' + (a.done ? (a.isCorrect ? ' correct':' incorrect') : '');

  $('revealArea').classList.toggle('hidden', !a.done);
  if(a.done){
    $('revealHanzi').innerHTML = rubyHTML(q.word, q.pinyin);
    $('revealMeaning').textContent = q.pos + '  ·  ' + q.meaning;
    $('feedback').textContent = a.isCorrect ? 'Chính xác!' : `Đáp án đúng: ${plainPinyin(q.pinyin)}`;
    $('feedback').className = 'type-feedback ' + (a.isCorrect ? 'correct':'incorrect');
  } else {
    $('feedback').textContent = '';
    $('feedback').className = 'type-feedback';
  }

  $('checkBtn').classList.toggle('hidden', a.done);
  $('nextBtn').classList.toggle('hidden', !a.done);
  $('nextBtn').textContent = current === questions.length - 1 ? 'Nộp bài ✓' : 'Câu tiếp ▶';
  $('prevBtn').disabled = current === 0;

  if(!a.done) setTimeout(()=>$('typeInput').focus(), 30);
}

function checkAnswer(){
  const q = questions[current];
  const a = answers[current];
  if(a.done) return;
  const val = $('typeInput').value;
  a.userAnswer = val;
  a.isCorrect = normalizePinyin(val) === normalizePinyin(plainPinyin(q.pinyin));
  a.done = true;
  renderQuestion();
}

$('speakBtn').addEventListener('click', ()=> speak(questions[current].word));
$('checkBtn').addEventListener('click', checkAnswer);
$('typeInput').addEventListener('keydown', e => { if(e.key==='Enter') checkAnswer(); });
$('prevBtn').addEventListener('click', ()=>{ if(current>0){ current--; renderQuestion(); } });
$('nextBtn').addEventListener('click', ()=>{
  if(!answers[current].done) return;
  if(current < questions.length-1){ current++; renderQuestion(); }
  else showResult();
});

function showResult(){
  let score = 0;
  const listEl = $('resultList');
  listEl.innerHTML = '';
  questions.forEach((q,i)=>{
    const a = answers[i];
    if(a.isCorrect) score++;
    const row = document.createElement('div');
    row.className = 'ritem ' + (a.isCorrect ? 'right':'wrong');
    row.innerHTML = `<span class="hanzi-ruby ruby-line">${rubyHTML(q.word,q.pinyin)}</span><span>${a.isCorrect ? '✓' : ('bạn gõ: '+(a.userAnswer||'—'))}</span>`;
    listEl.appendChild(row);
  });
  $('quizArea').classList.add('hidden');
  $('resultArea').classList.remove('hidden');
  $('scoreText').textContent = `${score} / ${questions.length}`;
  const pct = score/questions.length;
  $('stampArea').innerHTML = pct>=0.7 ? '<div class="stamp pass">Đạt</div>' : '<div class="stamp retry">Cần ôn thêm</div>';
}

$('retryBtn').addEventListener('click', ()=> window.location.reload());

renderQuestion();
</script>
</body>
</html>
